<svg viewBox="0 0 730 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="730" height="420" fill="#ffffff"/>

  <!-- ===== Terminal ls -l output : each column positioned independently ===== -->
  <g font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="16" fill="#111111">
    <!-- permissions (left) -->
    <text x="70" y="48">-rw-r--r--</text>
    <text x="70" y="73">-rw-r--r--</text>
    <text x="70" y="98">drwxr-x---</text>
    <text x="70" y="123">drwxr-xr-x</text>
    <!-- hard-link count (left) -->
    <text x="178" y="48">1</text>
    <text x="178" y="73">1</text>
    <text x="178" y="98">2</text>
    <text x="178" y="123">3</text>
    <!-- owner (left) -->
    <text x="196" y="48">fangping</text>
    <text x="196" y="73">fangping</text>
    <text x="196" y="98">fangping</text>
    <text x="196" y="123">fangping</text>
    <!-- group (left) -->
    <text x="285" y="48">sam</text>
    <text x="285" y="73">sam</text>
    <text x="285" y="98">sam</text>
    <text x="285" y="123">sam</text>
    <!-- size (RIGHT justified) -->
    <text x="372" y="48" text-anchor="end">1623</text>
    <text x="372" y="73" text-anchor="end">400</text>
    <text x="372" y="98" text-anchor="end">3</text>
    <text x="372" y="123" text-anchor="end">3</text>
    <!-- date/time (left, fixed x so it lines up vertically) -->
    <text x="386" y="48">Jan 20 13:25</text>
    <text x="386" y="73">Jan 20 13:33</text>
    <text x="386" y="98">Jan 20 13:31</text>
    <text x="386" y="123">Jan 20 18:10</text>
    <!-- file names (LEFT justified) -->
    <text x="512" y="48">input.json</text>
    <text x="512" y="73">job.sbatch</text>
    <text x="512" y="98">models</text>
    <text x="512" y="123">output</text>
  </g>

  <!-- ===== Connector lines (navy, plain verticals, no top ticks) ===== -->
  <g stroke="#164a5f" stroke-width="1.6" fill="none">
    <!-- left staircase -->
    <line x1="75"  y1="134" x2="75"  y2="390"/>  <!-- File Type -->
    <!-- User/Owner Permissions: 3-char cap over user triplet + drop -->
    <line x1="80"  y1="134" x2="108" y2="134"/>
    <line x1="94"  y1="134" x2="94"  y2="362"/>
    <!-- Group Permissions: 3-char cap over group triplet + drop -->
    <line x1="109" y1="134" x2="137" y2="134"/>
    <line x1="123" y1="134" x2="123" y2="332"/>
    <!-- Other/Everyone Permissions: 3-char cap over other triplet + drop -->
    <line x1="138" y1="134" x2="166" y2="134"/>
    <line x1="152" y1="134" x2="152" y2="300"/>
    <line x1="183" y1="134" x2="183" y2="270"/>  <!-- Number of Hard Links -->
    <!-- middle staircase -->
    <line x1="234" y1="134" x2="234" y2="235"/>  <!-- User/Owner Name -->
    <line x1="299" y1="134" x2="299" y2="196"/>  <!-- Group Name -->
    <line x1="360" y1="134" x2="360" y2="165"/>  <!-- Size -->
    <line x1="444" y1="134" x2="444" y2="172"/>  <!-- Date/Time -->
    <line x1="546" y1="134" x2="546" y2="150"/>  <!-- File Names (points at p of output) -->
  </g>

  <!-- ===== Bottom-left staircase labels ===== -->
  <g font-size="13.5" fill="#111111">
    <text x="160" y="285">Number of Hard Links</text>
    <text x="132" y="315">Other/Everyone Permissions</text>
    <text x="105" y="347">Group Permissions</text>
    <text x="78"  y="377">User/Owner Permissions</text>
    <text x="64"  y="405">File Type</text>
  </g>

  <!-- ===== Middle staircase labels ===== -->
  <g font-size="13.5" fill="#111111">
    <text x="212" y="250">User/Owner Name</text>
    <text x="299" y="211" text-anchor="middle">Group Name</text>
    <text x="360" y="180" text-anchor="middle">Size</text>
    <text x="418" y="187">Date/Time last modified</text>
    <text x="546" y="164" text-anchor="middle">File Names</text>
  </g>

  <!-- ===== rwx legend : two-row rectangular block, right edge aligned to input.json ===== -->
  <g font-size="22" font-weight="bold" fill="#003594" text-anchor="middle">
    <text x="409" y="320">r</text>
    <text x="491" y="320">w</text>
    <text x="573" y="320">x</text>
  </g>
  <!-- straight vertical drops ending in an open chevron (inverted caret) -->
  <g stroke="#003594" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="409" y1="330" x2="409" y2="362"/>
    <polyline points="403,353 409,362 415,353"/>
    <line x1="491" y1="330" x2="491" y2="362"/>
    <polyline points="485,353 491,362 497,353"/>
    <line x1="573" y1="330" x2="573" y2="362"/>
    <polyline points="567,353 573,362 579,353"/>
  </g>
  <g font-size="13.5" fill="#003594" text-anchor="middle">
    <text x="409" y="384">Readable</text>
    <text x="491" y="384">Writable</text>
    <text x="573" y="384">Executable</text>
  </g>
</svg>
