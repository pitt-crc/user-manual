name: Build and Publish Documentation
description: >
  Install project dependencies and build the documentation site, optionally deploying
  the result to GitHub Pages. Deploying requires the calling job to grant the 
  `pages: write` and `id-token: write` permissions and to target an environment
  configured for GitHub Pages.

inputs:
  python-version:
    description: The Python version used to build the documentation.
    required: false
    default: '3.x'
  requirements-file:
    description: Path to the pip requirements file.
    required: false
    default: requirements.txt
  site-dir:
    description: Directory the built site is written to.
    required: false
    default: site
  strict:
    description: Fail the build on MkDocs warnings (broken links, missing pages).
    required: false
    default: 'false'
  publish:
    description: >
      Upload the built site and deploy it to GitHub Pages. Requires the
      `pages: write` and `id-token: write` permissions on the calling job.
    required: false
    default: 'false'

outputs:
  page-url:
    description: URL of the deployed documentation site. Empty unless `publish` is enabled.
    value: ${{ steps.deployment.outputs.page_url }}

runs:
  using: composite
  steps:
    - name: Setup Pages
      if: inputs.publish == 'true'
      uses: actions/configure-pages@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: ${{ inputs.requirements-file }}

    - name: Install dependencies
      shell: bash
      run: pip install -r "${{ inputs.requirements-file }}"

    - name: Build documentation
      shell: bash
      run: mkdocs build --site-dir "${{ inputs.site-dir }}" ${{ inputs.strict == 'true' && '--strict' || '' }}

    - name: Upload docs to artifact storage
      if: inputs.publish == 'true'
      uses: actions/upload-pages-artifact@v3.0.1
      with:
        path: ${{ inputs.site-dir }}

    - name: Deploy to GitHub Pages
      if: inputs.publish == 'true'
      id: deployment
      uses: actions/deploy-pages@v4
