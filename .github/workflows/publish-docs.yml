name: Publish Documentation

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: publish-docs
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    name: Publish Documentation
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.docs.outputs.page-url }}

    steps:
      - uses: actions/checkout@v4

      - name: Build and publish documentation
        id: docs
        uses: ./.github/actions/build-docs
        with:
          strict: 'true'
          publish: 'true'
